services:
  postgres:
    image: postgres:16-alpine
    container_name: rocketseat_fastify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: rocketseat_fastify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d rocketseat_fastify"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
